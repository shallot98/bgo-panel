<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="bgo">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>bgo 面板</title>
<style>
:root {
  --font: "Sarasa Mono SC", "Sarasa Term SC", "更纱黑体 SC", "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
  --canvas: #09090a; --bg: #121214; --surface: #1c1c1f; --elevated: #222226;
  --border: #2c2c30; --border-soft: #212124;
  --fg: #f4f4f6; --fg-2: #a1a1aa; --muted: #71717a; --meta: #52525b;
  --accent: #00a2fb; --accent-fill: #0579bd; --accent-active: #025e94; --accent-on: #fff;
  --success: #10b981; --warn: #f59e0b; --danger: #ef4444;
  --s1: #3b82f6; --s2: #10b981; --s3: #8b5cf6; --s4: #f43f5e; --s5: #f59e0b; --s6: #06b6d4;
  --wash: rgba(244,244,246,.06); --wash-2: rgba(244,244,246,.10);
  --icon: var(--fg);
  --shadow: 0 8px 28px rgba(0,0,0,.55), 0 0 0 1px var(--border);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --canvas: #f5f5f5; --bg: #ffffff; --surface: #f4f4f5; --elevated: #ffffff;
  --border: #dcdce1; --border-soft: #ececef;
  --fg: #18181b; --fg-2: #52525b; --muted: #71717a; --meta: #a1a1aa;
  --accent: #005d8f; --accent-fill: #004a73; --accent-active: #023b5d;
  --success: #059669; --warn: #b45309; --danger: #dc2626;
  --s1: #2563eb; --s2: #059669; --s3: #7c3aed; --s4: #e11d48; --s5: #b45309; --s6: #0891b2;
  --wash: rgba(24,24,27,.05); --wash-2: rgba(24,24,27,.08);
  --icon: #000;
  --shadow: 0 8px 28px rgba(0,0,0,.12), 0 0 0 1px var(--border);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--canvas); color: var(--fg); font: 400 14px/1.5 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
.shell { display: flex; height: 100dvh; }
.rail { width: 236px; flex: none; padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.brand { font-weight: 700; font-size: 18px; letter-spacing: -.02em; padding: 4px 10px 14px; display: flex; align-items: center; gap: 8px; }
.brand b { color: var(--accent); }
.brand .mark { width: 18px; height: 18px; border-radius: 4px; background: linear-gradient(135deg, var(--fg) 55%, var(--accent) 55%); }
.navgroup { font-size: 11px; color: var(--meta); padding: 14px 10px 4px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--fg-2); cursor: pointer; border: 0; background: none; text-align: left; width: 100%; transition: background .12s; }
.nav:hover { background: var(--wash); color: var(--fg); }
.nav.on { background: var(--wash-2); color: var(--fg); font-weight: 500; }
.nav svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; }
.nav .badge { margin-left: auto; font-size: 11px; color: var(--muted); }
.rail .foot { margin-top: auto; padding: 12px 10px 0; font-size: 11px; color: var(--meta); line-height: 1.7; }
.panel { flex: 1; min-width: 0; margin: 8px 8px 8px 0; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
.head { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 20px; }
.crumb { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb b { color: var(--fg); font-weight: 500; }
.head .sp { flex: 1; }
.hbtn { height: 32px; min-width: 32px; padding: 0 8px; border-radius: 6px; border: 0; background: none; color: var(--fg-2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.hbtn:hover { background: var(--wash); color: var(--fg); }
.hbtn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.hbtn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.menu-btn { display: none; }
.content { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.page { max-width: 1440px; margin: 0 auto; padding: 8px 32px 40px; }
.ptitle { display: flex; align-items: flex-end; gap: 12px; margin: 8px 0 20px; flex-wrap: wrap; }
.ptitle h1 { font-size: 22px; font-weight: 700; margin: 0; line-height: 1.2; }
.ptitle .sub { font-size: 12px; color: var(--fg-2); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ptitle .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid transparent; background: var(--wash); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: background .12s; }
.btn:hover { background: var(--wash-2); }
.btn.primary { background: var(--accent-fill); color: var(--accent-on); }
.btn.primary:hover { background: var(--accent-active); }
.btn.danger:hover { color: var(--danger); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: 2fr 1fr; }
.g11 { grid-template-columns: 1fr 1fr; }
.card { border: 1px solid var(--border); border-radius: 12px; padding: 20px; min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.card h3 { margin: 0 0 14px; font-size: 13px; font-weight: 500; color: var(--fg-2); display: flex; align-items: center; gap: 8px; }
.card.flush h3 { padding: 16px 20px 0; }
.card h3 .r { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--muted); }
.kpi-label { font-size: 12px; color: var(--fg-2); }
.kpi { font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; margin: 10px 0 8px; }
.kpi.big { font-size: 42px; letter-spacing: -.04em; }
.kpi small { font-size: 14px; font-weight: 400; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.kpi-meta { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.kpi-meta b { color: var(--fg-2); font-weight: 500; }
.pip { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.pip.ok { background: var(--success); } .pip.warn { background: var(--warn); } .pip.bad { background: var(--danger); } .pip.info { background: var(--accent); }
.pip.live { background: var(--danger); box-shadow: 0 0 0 0 rgba(239,68,68,.6); animation: pulse 1.6s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 6px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
.t-ok { color: var(--success); } .t-warn { color: var(--warn); } .t-bad { color: var(--danger); } .t-mute { color: var(--muted); } .t-2 { color: var(--fg-2); } .t-acc { color: var(--accent); }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 4px; font-size: 11px; border: 1px solid var(--border); color: var(--fg-2); white-space: nowrap; }
.tag.temp { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.tag.session { color: var(--s3); border-color: color-mix(in srgb, var(--s3) 45%, transparent); }
.tag.perm { color: var(--muted); }
.tag.fo { color: var(--s5); border-color: color-mix(in srgb, var(--s5) 45%, transparent); margin-left: 4px; }
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; background: none; text-align: left; transition: background .12s; }
.tile:hover { background: var(--wash); }
.tile.on { background: var(--wash-2); border-color: var(--fg-2); }
.tile .n { font-size: 22px; font-weight: 700; line-height: 1.2; }
.tile .l { font-size: 11px; color: var(--muted); }
.toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.input { height: 32px; padding: 4px 11px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); outline: none; min-width: 0; }
.input:focus { border-color: var(--accent); }
.input.grow { flex: 1; }
select.input { padding-right: 28px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 14px) 14px, calc(100% - 9px) 14px; background-size: 5px 5px; background-repeat: no-repeat; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-weight: 500; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; background: var(--surface); padding: 9px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.table td { padding: 10px 14px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr:hover td { background: color-mix(in srgb, var(--fg) 2.5%, transparent); }
.frame { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.frame .scroll { overflow-x: auto; overscroll-behavior-x: contain; }
.who { display: flex; flex-direction: column; min-width: 0; }
.who .n { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.who .s { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.mono { font-family: var(--font); font-size: 12px; }
.num { text-align: right; white-space: nowrap; }
.row-acts { display: flex; gap: 4px; justify-content: flex-end; align-items: center; }
.sq { width: 30px; height: 30px; flex: none; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--icon); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; -webkit-appearance: none; appearance: none; text-decoration: none; }
.sq:hover { background: var(--wash-2); color: var(--icon); border-color: var(--icon); }
.sq.edit { color: var(--icon); }
.sq svg { width: 16px; height: 16px; min-width: 16px; flex: none; display: block; stroke: currentColor; fill: none; stroke-width: 1.8; }
.switch { position: relative; width: 34px; height: 20px; border-radius: 10px; border: 0; background: var(--border); cursor: pointer; flex: none; transition: background .16s; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .16s; }
.switch.on { background: var(--success); }
.switch.on::after { transform: translateX(14px); }
.switch:disabled { opacity: .5; cursor: wait; }
.bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.list-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-soft); min-width: 0; }
.list-row:last-child { border-bottom: 0; }
.list-row .grow { flex: 1; min-width: 0; }
.empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }
.chart { width: 100%; height: 180px; display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg-2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.logline { font-size: 12px; padding: 8px 0; border-bottom: 1px solid var(--border-soft); display: grid; grid-template-columns: 140px 64px 1fr; gap: 10px; }
.logline:last-child { border-bottom: 0; }
.logline .e { color: var(--muted); word-break: break-all; grid-column: 3; }
.proc { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border-soft); font-size: 13px; }
.proc:last-child { border-bottom: 0; }
.proc .u { margin-left: auto; color: var(--muted); font-size: 12px; }
.banner { border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 8%, transparent); color: var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
.banner .btn { margin-left: auto; }
.mask { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.mask.on { display: flex; }
:root[data-theme="light"] .mask { background: rgba(0,0,0,.12); }
.dialog { width: 460px; max-width: 100%; max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--elevated); border-radius: 12px; box-shadow: var(--shadow); padding: 22px; }
.dialog.wide { width: 760px; }
.dialog h2 { font-size: 16px; font-weight: 600; margin: 0 0 16px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 12px; color: var(--fg-2); }
.field .hint { font-size: 11px; color: var(--muted); }
.seg { display: flex; background: var(--surface); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { flex: 1; height: 30px; border: 0; border-radius: 6px; background: none; color: var(--fg-2); cursor: pointer; font-size: 13px; }
.seg button.on { background: var(--bg); color: var(--fg); box-shadow: 0 0 0 1px var(--border); }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.linkish:hover b, .linkish:hover { text-decoration: underline; }
.sdist { display: grid; gap: 6px; }
.sbar { display: grid; grid-template-columns: 16px 1fr 48px; align-items: center; gap: 10px; font-size: 12px; }
.sbar .bar { margin: 0; }
.sbar .num { text-align: right; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 28px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border); background: none; color: var(--fg-2); cursor: pointer; font-size: 12px; }
.chip.on { border-color: var(--accent); color: var(--accent); }
.dfoot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.toast-wrap { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--elevated); box-shadow: var(--shadow); border-radius: 8px; padding: 10px 14px; font-size: 13px; display: flex; gap: 8px; align-items: center; max-width: 420px; animation: tin .18s ease-out; }
@keyframes tin { from { opacity: 0; transform: translateY(6px); } }
.login { height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.login .box { width: 360px; max-width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: 12px; padding: 28px; }
.login h1 { font-size: 20px; margin: 0 0 4px; }
.login p { color: var(--muted); font-size: 12px; margin: 0 0 20px; }
.login .err { color: var(--danger); font-size: 12px; min-height: 18px; margin-top: 8px; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-all; }
.hide { display: none !important; }
.scrim { display: none; }
@media (max-width: 1200px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .rail { position: fixed; z-index: 40; left: 0; top: 0; bottom: 0; width: min(320px, 86vw); background: var(--canvas); transform: translateX(-100%); transition: transform .18s ease-out; }
  .shell.nav-open .rail { transform: none; }
  .shell.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 39; background: rgba(0,0,0,.5); }
  .panel { margin: 0; border-radius: 0; border: 0; }
  .menu-btn { display: inline-flex; }
  .page { padding: 4px 24px 32px; }
  .g3, .g2, .g11 { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .page { padding: 4px 16px 32px; }
  .head { height: 48px; padding: 0 12px; }
  .g4 { grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { padding: 16px; }
  .kpi { font-size: 26px; } .kpi.big { font-size: 32px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .table.resp thead { display: none; }
  .table.resp, .table.resp tbody, .table.resp tr, .table.resp td { display: block; width: 100%; }
  .table.resp tr { padding: 10px 14px; border-bottom: 1px solid var(--border-soft); }
  .table.resp td { border: 0; padding: 3px 0; display: flex; justify-content: space-between; gap: 12px; text-align: right; }
  .table.resp td::before { content: attr(data-l); color: var(--muted); font-size: 12px; text-align: left; flex: none; }
  .table.resp td.first { display: block; text-align: left; }
  .table.resp td.first::before { display: none; }
  .table.resp .row-acts { justify-content: flex-end; }
  .who .n, .who .s { max-width: 70vw; }
  .logline { grid-template-columns: 1fr auto; }
  .logline .e, .logline .m { grid-column: 1 / -1; }
  @media (pointer: coarse) { .input, select.input { font-size: 16px; } }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="login" class="login hide">
  <form class="box" id="loginForm">
    <div class="brand" style="padding:0 0 18px"><span class="mark"></span>bgo<b>.</b>panel</div>
    <h1>登录</h1>
    <p>bililive-go 监控面板 · boh</p>
    <div class="field"><label for="pw">密码</label><input id="pw" class="input" type="password" autocomplete="current-password" autofocus></div>
    <button class="btn primary" style="width:100%;justify-content:center" type="submit">登录</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" class="shell hide">
  <div class="scrim" onclick="toggleNav(false)"></div>
  <nav class="rail">
    <div class="brand"><span class="mark"></span>bgo<b>.</b>panel</div>
    <div class="navgroup">运行</div>
    <button class="nav" data-r="overview"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>总览</button>
    <button class="nav" data-r="rooms"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="M17 10l5-3v10l-5-3"/></svg>房间<span class="badge" id="navRooms"></span></button>
    <button class="nav" data-r="managed"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>临时与本场<span class="badge" id="navManaged"></span></button>
    <button class="nav" data-r="failover"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h11a4 4 0 0 1 0 8H9"/><path d="M12 11l-3 4 3 4M20 7l-3-3M20 7l-3 3"/></svg>备援<span class="badge" id="navFailover"></span></button>
    <button class="nav" data-r="add"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>快速添加</button>
    <div class="navgroup">观测</div>
    <button class="nav" data-r="sessions"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>录制记录</button>
    <button class="nav" data-r="health"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>健康</button>

<div class="mask" id="mask" onclick="if(event.target===this)closeDialog()"><div class="dialog" id="dialog"></div></div>
<div class="toast-wrap" id="toasts"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ROUTES = { overview: "总览", rooms: "房间", managed: "临时与本场", sessions: "录制记录", health: "健康", storage: "存储", oplog: "操作日志", settings: "设置", add: "快速添加", failover: "备援" };
const GROUP = { overview: "运行", rooms: "运行", managed: "运行", sessions: "观测", health: "观测", storage: "观测", oplog: "控制", settings: "控制", add: "运行", failover: "运行" };
const state = { rooms: null, filter: "all", q: "", timer: null, lastRefresh: 0, overview: null, hosts: [], scores: null };

// ---------------- 主题
const THEME_ICONS = {
  dark: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  light: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  system: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>'
};
function getTheme() { try { return localStorage.getItem("bgo-theme") || "dark"; } catch { return "dark"; } }
function applyTheme() {
  const t = getTheme();
  const eff = t === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : t;
  document.documentElement.dataset.theme = eff;
  $("#themeBtn").innerHTML = THEME_ICONS[t];
}
function cycleTheme() {
  const order = ["dark", "light", "system"];
  const n = order[(order.indexOf(getTheme()) + 1) % 3];
  try { localStorage.setItem("bgo-theme", n); } catch {}
  applyTheme();
  if (state.overview && currentRoute() === "overview") renderOverview();
}
matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyTheme);

// ---------------- 工具
// 多服务器：除登录、密码、密钥、服务器列表外，所有 /api 请求都带上当前选中的服务器 ?host=
const HOST_FREE = ["/api/login", "/api/logout", "/api/me", "/api/password", "/api/token", "/api/token/rotate", "/api/hosts", "/api/scores", "/api/failover", "/api/failover/config", "/api/failover/takeover", "/api/failover/release", "/api/failover/sync", "/api/failover/run"];
function getHost() { try { return localStorage.getItem("bgo-host") || ""; } catch { return ""; } }
function withHost(path, override) {
  const h = override !== undefined ? override : getHost();
  if (!h || HOST_FREE.includes(path.split("?")[0])) return path;
  return path + (path.includes("?") ? "&" : "?") + "host=" + encodeURIComponent(h);
}
async function api(path, opts = {}) {
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), opts.timeout || 45000);
  let r;
  try { r = await fetch(withHost(path, opts.host), { credentials: "same-origin", headers: opts.body ? { "Content-Type": "application/json" } : {}, method: opts.method, body: opts.body ? JSON.stringify(opts.body) : undefined, signal: ctl.signal }); }
  catch (e) { throw new Error(e.name === "AbortError" ? `请求超时（${path.split("?")[0]}），服务器响应太慢，请稍后刷新` : `网络错误：${e.message}`); }
  finally { clearTimeout(timer); }
  let d = null;
  try { d = await r.json(); } catch {}
  if (r.status === 401 && path !== "/api/login") { showLogin(); throw new Error("未登录"); }
  if (!r.ok) throw new Error((d && d.error) || ("HTTP " + r.status));
  return d;
}
function toast(msg, tone = "ok") {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span class="pip ${tone}"></span><span>${esc(msg)}</span>`;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), tone === "bad" ? 7000 : 3500);
}
const fmtN = n => (n ?? 0).toLocaleString("en-US");
function fmtBytes(b) { if (b == null) return "—"; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (b >= 1024 && i < 4) { b /= 1024; i++; } return (i ? b.toFixed(b >= 100 ? 0 : 1) : b) + " " + u[i]; }
function fmtDur(s) { if (s == null) return "—"; s = Math.max(0, Math.round(s)); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); if (d) return `${d}天${h}时`; if (h) return `${h}时${String(m).padStart(2, "0")}分`; if (m) return `${m}分`; return `${s}秒`; }
function fmtTs(ts, withDate = true) { if (!ts) return "—"; const d = typeof ts === "number" ? new Date(ts * 1000) : new Date(ts); if (isNaN(d)) return "—"; const p = n => String(n).padStart(2, "0"); return (withDate ? `${p(d.getMonth() + 1)}-${p(d.getDate())} ` : "") + `${p(d.getHours())}:${p(d.getMinutes())}`; }
function ago(ts) { if (!ts) return "—"; const s = Date.now() / 1000 - ts; if (s < 60) return "刚刚"; if (s < 3600) return Math.floor(s / 60) + " 分钟前"; if (s < 86400) return Math.floor(s / 3600) + " 小时前"; return Math.floor(s / 86400) + " 天前"; }
function roomKey(url) { try { return new URL(url).pathname.replace(/^\/+/, "").split("/")[0]; } catch { return url; } }
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

// ---------------- 登录
function showLogin() { clearInterval(state.timer); $("#app").classList.add("hide"); $("#login").classList.remove("hide"); setTimeout(() => $("#pw").focus(), 30); }
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("#loginErr").textContent = "";
  try { await api("/api/login", { method: "POST", body: { password: $("#pw").value } }); $("#pw").value = ""; boot(); }
  catch (err) { $("#loginErr").textContent = err.message; }
});
async function logout() { try { await api("/api/logout", { method: "POST" }); } catch {} showLogin(); }

// ---------------- 路由
function currentRoute() { const r = location.hash.replace("#", "").split("?")[0]; return ROUTES[r] ? r : "overview"; }
function hashParams() { const h = location.hash; const i = h.indexOf("?"); return new URLSearchParams(i >= 0 ? h.slice(i + 1) : ""); }
function toggleNav(v) { $("#app").classList.toggle("nav-open", v); }
document.querySelectorAll(".nav").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.r; toggleNav(false); }));
window.addEventListener("hashchange", () => render(true));

async function render(force) {
  const r = currentRoute();
  document.querySelectorAll(".nav").forEach(b => b.classList.toggle("on", b.dataset.r === r));
  $("#crumb").innerHTML = `${GROUP[r]} / <b>${ROUTES[r]}</b>${state.hosts && state.hosts.length > 1 ? ` <span class="t-mute">· ${esc(hostLabel())}</span>` : ""}`;
  const btn = $("#refreshBtn"); btn.classList.add("spin");
  if (force && !$("#page").innerHTML.trim()) $("#page").innerHTML = `<div class="ptitle"><h1>${ROUTES[r]}</h1></div><div class="empty">加载中…</div>`;
  try {
    await ({ overview: loadOverview, rooms: loadRooms, managed: loadManaged, sessions: loadSessions, health: loadHealth, storage: loadStorage, oplog: loadOplog, settings: loadSettings, add: loadQuickAdd, failover: loadFailover })[r](force);
    state.lastRefresh = Date.now();
    $("#clock").textContent = fmtTs(Date.now() / 1000, false);
  } catch (e) {
    if (e.message !== "未登录") { $("#page").innerHTML = `<div class="ptitle"><h1>${ROUTES[r]}</h1></div><div class="banner" style="color:var(--danger);border-color:var(--danger)">加载失败：${esc(e.message)}</div>`; }
  } finally { btn.classList.remove("spin"); }
}

async function boot() {
  $("#login").classList.add("hide"); $("#app").classList.remove("hide");
  applyTheme();
  loadHosts().then(() => { if (currentRoute() === "overview" && state.overview) renderOverview(); });
  await render(true);
  clearInterval(state.timer);
  state.timer = setInterval(() => { if (!document.hidden && !$("#mask").classList.contains("on") && ["overview", "rooms", "managed", "failover"].includes(currentRoute())) render(false); }, 20000);
}

// ---------------- 服务器切换
async function loadHosts() {
  try { state.hosts = await api("/api/hosts", { timeout: 20000 }); } catch (e) { state.hosts = state.hosts || []; toast("服务器列表加载失败：" + e.message, "warn"); }
  const sel = $("#hostSel"); const cur = getHost();
  if (state.hosts.length <= 1) { sel.classList.add("hide"); if (cur) setHost(""); return; }
  sel.classList.remove("hide");
  if (cur && !state.hosts.some(h => h.name === cur)) setHost("");
  sel.innerHTML = state.hosts.map(h => `<option value="${h.local ? "" : esc(h.name)}">${h.ok ? "●" : "○"} ${esc(h.name)}${h.ok ? ` · ${h.recording} 在录` : " · 失联"}</option>`).join("");
  sel.value = getHost();
}
function setHost(v) { try { v ? localStorage.setItem("bgo-host", v) : localStorage.removeItem("bgo-host"); } catch {} state.rooms = null; }
function hostLabel() { const h = getHost(); return h || (state.hosts && state.hosts.find(x => x.local) || {}).name || "boh"; }
function hostStrip() {
  if (!state.hosts || state.hosts.length <= 1) return "";
  return `<div class="grid g${Math.min(state.hosts.length, 4)}" style="margin-bottom:16px">${state.hosts.map(h => `
    <button class="tile ${(h.local ? "" : h.name) === getHost() ? "on" : ""}" onclick="switchHost('${h.local ? "" : esc(h.name)}')" style="padding:14px 16px">
      <div style="display:flex;align-items:center;gap:8px;font-weight:500"><span class="pip ${h.ok ? "ok" : "bad"}"></span>${esc(h.name)}${h.local ? ' <span class="t-mute" style="font-size:11px;font-weight:400">本机</span>' : ""}</div>
      ${h.ok ? `<div class="kpi-meta" style="margin-top:8px"><span>在录 <b class="${h.recording ? "t-bad" : ""}">${h.recording}</b></span><span>开播 <b>${h.living}</b></span><span>监听 <b>${h.listening}/${h.total}</b></span>${h.managed ? `<span>托管 <b class="t-acc">${h.managed}</b></span>` : ""}</div>`
        : `<div class="t-bad" style="font-size:12px;margin-top:8px;word-break:break-all">${esc(h.error || "失联")}</div>`}
    </button>`).join("")}</div>`;
}
function hostField(preset) {
  if (!state.hosts || state.hosts.length <= 1) return "";
  const cur = preset != null ? preset : getHost();
  return `<div class="field"><label>服务器</label><select class="input" id="addHost">${state.hosts.map(h => { const v = h.local ? "" : h.name; return `<option value="${esc(v)}" ${v === cur || (h.local && cur === h.name) ? "selected" : ""} ${h.ok ? "" : "disabled"}>${esc(h.name)}${h.ok ? ` · ${h.total} 个房间` : " · 失联"}</option>`; }).join("")}</select></div>`;
}
function formHost() { const el = $("#addHost"); return el ? el.value : undefined; }
function switchHost(v) { setHost(v); $("#hostSel").value = v; render(true); }

// ---------------- 总览
async function loadOverview() {
  state.overview = await api("/api/overview"); renderOverview();
  api("/api/hosts", { timeout: 20000 }).then(h => { state.hosts = h; if (currentRoute() === "overview") renderOverview(); }).catch(() => {});
}
function renderOverview() {
  const d = state.overview, c = d.counts, ls = d.logstats || {}, today = ls.today || {};
  $("#navRooms").textContent = c.total; $("#navManaged").textContent = (c.temp + c.session) || "";
  $("#railFoot").innerHTML = `bgo ${esc(d.bgo.app_version || "?")} · pid ${esc(d.bgo.pid || "?")}<br>面板 · ${esc(hostLabel())}`;
  const errs = (today.room_fast || 0) + (today.room_deadline || 0) + (today.stream_fail || 0) + (today.other_error || 0);
  const procsDown = d.procs.filter(p => p.alive === false && !["bgo_wd", "panel_wd"].includes(p.key));
  const diskPct = d.disk ? d.disk.used / d.disk.total * 100 : 0;
  $("#page").innerHTML = `
  ${d.pw_is_default ? `<div class="banner"><span class="pip warn"></span>当前仍是初始密码，建议尽快修改。<a class="btn sm" href="#settings">去修改</a></div>` : ""}
  ${hostStrip()}${foBanner(d.failover)}
  <div class="ptitle"><h1>总览</h1><div class="sub">
    <span class="st"><span class="pip ${procsDown.length ? "bad" : "ok"}"></span>${procsDown.length ? procsDown.length + " 个进程异常" : "进程正常"}</span>
    <span class="t-mute">·</span><span>bgo ${esc(d.bgo.app_version || "")}</span></div>
    <div class="acts"><button class="btn primary" onclick="openAdd()">${ICON.plus}添加房间</button></div></div>
  <div class="grid g4">
    <div class="card"><div class="kpi-label">正在录制</div><div class="kpi big ${c.recording ? "t-bad" : ""}">${c.recording}</div>
      <div class="kpi-meta"><span>开播 <b>${c.living}</b></span><span>开播未录 <b class="${d.living_not_recording.length ? "t-warn" : ""}">${d.living_not_recording.length}</b></span></div></div>
    <div class="card"><div class="kpi-label">监听中</div><div class="kpi">${c.listening}<small>/ ${c.total}</small></div>
      <div class="kpi-meta"><span>临时 <b class="t-warn">${c.temp}</b></span><span>按场次 <b style="color:var(--s3)">${c.session}</b></span></div></div>
    <div class="card"><div class="kpi-label">今日录制</div><div class="kpi">${d.today_sessions}<small>场</small></div>
      <div class="kpi-meta"><span>时长 <b>${fmtDur(d.today_duration)}</b></span><span>开播 <b>${today.live_start || 0}</b></span></div></div>
    <div class="card"><div class="kpi-label">今日错误</div><div class="kpi ${errs > 500 ? "t-bad" : errs > 100 ? "t-warn" : ""}">${fmtN(errs)}</div>
      <div class="kpi-meta"><span>快速500 <b>${today.room_fast || 0}</b></span><span>超时 <b>${today.room_deadline || 0}</b></span><span>取流 <b>${today.stream_fail || 0}</b></span></div></div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h3>近 24 小时错误<span class="r">${ls.updated ? "更新于 " + ago(ls.updated) : "统计中…"}</span></h3>${errChart(ls.hours || [])}</div>
    <div class="card"><h3>进程</h3>${procList(d.procs)}</div>
  </div>
  <div class="grid g11" style="margin-top:16px">
    <div class="card"><h3>正在录制<span class="r">${c.recording} 个</span></h3>${d.recording.length ? d.recording.map(liveRow).join("") : '<div class="empty">当前没有在录的房间</div>'}</div>
    <div class="card"><h3>开播但未录制<span class="r">${d.living_not_recording.length} 个</span></h3>${d.living_not_recording.length ? d.living_not_recording.map(liveRow).join("") : '<div class="empty">没有</div>'}</div>
  </div>
  <div class="grid g3" style="margin-top:16px">
    <div class="card"><div class="kpi-label">磁盘</div><div class="kpi" style="font-size:26px">${d.disk ? fmtBytes(d.disk.free) : "—"}<small>可用</small></div>
      <div class="bar"><i style="width:${diskPct.toFixed(1)}%;background:${diskPct > 85 ? "var(--danger)" : diskPct > 70 ? "var(--warn)" : "var(--accent)"}"></i></div>
      <div class="kpi-meta" style="margin-top:8px"><span>已用 <b>${diskPct.toFixed(0)}%</b></span><span>录像 <b>${fmtBytes(d.video_total)}</b></span></div></div>
    <div class="card"><div class="kpi-label">今日直播事件</div><div class="kpi" style="font-size:26px">${today.record_start || 0}<small>次开录</small></div>
      <div class="kpi-meta"><span>结束录制 <b>${today.record_end || 0}</b></span><span>下播 <b>${today.live_end || 0}</b></span></div></div>
    <div class="card"><div class="kpi-label">其他错误</div><div class="kpi" style="font-size:26px">${today.other_error || 0}</div>
      <div class="kpi-meta"><span><a href="#health">查看健康页</a></span></div></div>
  </div>`;
}
function liveRow(r) {
  const m = r.mode;
  return `<div class="list-row"><span class="pip ${r.recording ? "live" : r.status ? "warn" : ""}"></span>
    <div class="grow who"><span class="n">${esc(r.host_name || roomKey(r.live_url))}</span><span class="s">${esc(r.room_name || "")}</span></div>
    ${modeTag(m, r.managed)}${foTag(r)}<a class="sq" href="${esc(r.live_url)}" target="_blank" rel="noopener noreferrer" title="打开直播间">${ICON.ext}</a></div>`;
}
function procList(ps) {
  return ps.map(p => `<div class="proc"><span class="pip ${p.alive ? "ok" : p.alive === false ? (["bgo_wd", "panel_wd"].includes(p.key) ? "warn" : "bad") : ""}"></span>
    <span>${esc(p.name)}</span><span class="u">${p.alive ? "运行 " + fmtDur(p.uptime) : p.alive === false ? "未运行" : "未知"}</span></div>`).join("");
}
function errChart(hours) {
  if (!hours.length) return '<div class="empty">统计中…</div>';
  const keys = [["room_fast", "--s4", "快速 500"], ["room_deadline", "--s5", "超时"], ["stream_fail", "--s3", "取流失败"], ["other_error", "--s6", "其他"]];
  const W = 720, H = 180, pl = 34, pb = 20, pt = 8, iw = W - pl - 4, ih = H - pb - pt;
  const tot = hours.map(h => keys.reduce((a, [k]) => a + (h[k] || 0), 0));
  const max = Math.max(5, ...tot);
  const nice = Math.ceil(max / 4 / 5) * 5 * 4 || 4;
  const bw = iw / hours.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="近 24 小时错误">`;
  for (let i = 0; i <= 4; i++) { const y = pt + ih - ih * i / 4; s += `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="${css("--border-soft")}"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="${css("--muted")}">${nice * i / 4}</text>`; }
  hours.forEach((h, i) => {
    let y = pt + ih; const x = pl + i * bw + bw * .18, w = bw * .64;
    keys.forEach(([k, col]) => { const v = h[k] || 0; if (!v) return; const hh = ih * v / nice; y -= hh; s += `<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="${css(col)}" rx="1"><title>${h.hour}:00 ${k} ${v}</title></rect>`; });
    if (i % 3 === 0) s += `<text x="${x + w / 2}" y="${H - 5}" text-anchor="middle" font-size="10" fill="${css("--muted")}">${h.hour.slice(11)}</text>`;
  });
  s += "</svg>";
  return s + `<div class="legend">${keys.map(([k, c, l]) => `<span><i style="background:var(${c})"></i>${l}</span>`).join("")}</div>`;
}

async function loadSessions() {
  const d = await api("/api/sessions"); const items = d.items || [];
  const today = new Date().toISOString().slice(0, 10);
  const byDay = {};
  items.forEach(s => { const k = (s.start_time || "").slice(0, 10); byDay[k] = (byDay[k] || 0) + sessDur(s); });
  const days = [...Array(14)].map((_, i) => { const d = new Date(Date.now() - (13 - i) * 86400000); const k = d.toISOString().slice(0, 10); return [k, byDay[k] || 0]; });
  const max = Math.max(3600, ...days.map(x => x[1]));
  const W = 720, H = 140, pb = 20, ih = H - pb - 6, bw = W / 14;
  const chart = `<svg class="chart" style="height:140px" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${days.map(([k, v], i) => { const h = ih * v / max; return `<rect x="${i * bw + bw * .2}" y="${6 + ih - h}" width="${bw * .6}" height="${Math.max(h, 1)}" rx="2" fill="${k === today ? css("--accent") : css("--s1")}" opacity="${k === today ? 1 : .7}"><title>${k} ${fmtDur(v)}</title></rect><text x="${i * bw + bw / 2}" y="${H - 5}" text-anchor="middle" font-size="10" fill="${css("--muted")}">${k.slice(5)}</text>`; }).join("")}</svg>`;
  $("#page").innerHTML = `<div class="ptitle"><h1>录制记录</h1><div class="sub"><span>最近 ${items.length} 场</span><span class="t-mute">·</span><span class="t-mute">${d.updated ? "更新于 " + ago(d.updated) : "统计中，约 1 分钟"}</span></div></div>
    <div class="card" style="margin-bottom:16px"><h3>近 14 天录制时长<span class="r">峰值 ${fmtDur(max)}</span></h3>${chart}</div>
    ${items.length ? `<div class="frame"><div class="scroll"><table class="table resp"><thead><tr><th>主播</th><th>开始</th><th>结束</th><th class="num">时长</th><th>结束原因</th></tr></thead><tbody>${items.slice(0, 150).map(s => sessTr(s, true)).join("")}</tbody></table></div></div>` : '<div class="card"><div class="empty">统计中…</div></div>'}`;
}

      <div class="card"><h3>风控与出口<span class="r">${pm ? (pm.mode === "direct" ? "直连" : pm.mode === "proxy" ? "住宅代理" : "未知") : "—"}</span></h3>
        ${pm ? `<div class="${pm.mode === "direct" ? "t-warn" : pm.mode === "proxy" ? "t-ok" : "t-mute"}" style="font-size:13px;margin-bottom:10px">${esc(pm.detail || pm.mode)}${pm.wrapper_mtime ? " · 切换于 " + ago(pm.wrapper_mtime) : ""}</div>` : ""}
        ${ch.error ? `<div class="t-bad" style="font-size:12px;margin-bottom:8px">统计失败：${esc(ch.error)}</div>` : ""}
        <dl class="kv" style="grid-template-columns:132px 1fr">
          <dt>今日 444（风控）${ch.approx ? '<span class="t-mute">≈</span>' : ""}</dt><dd class="${(ch.today || {}).http444 ? "t-bad" : "t-ok"}">${fmtN((ch.today || {}).http444 || 0)}</dd>
          <dt>今日通道熔断${ch.approx ? '<span class="t-mute">≈</span>' : ""}</dt><dd class="${(ch.today || {}).circuit ? "t-warn" : "t-ok"}">${fmtN((ch.today || {}).circuit || 0)}</dd>
          <dt>今日通道失败${ch.approx ? '<span class="t-mute">≈</span>' : ""}</dt><dd>${fmtN((ch.today || {}).channel_fail || 0)}</dd>
          <dt>近 5 分钟 444</dt><dd class="${(ch.last5m || {}).http444 ? "t-bad" : "t-ok"}">${fmtN((ch.last5m || {}).http444 || 0)}</dd>
          <dt>近 5 分钟熔断</dt><dd class="${(ch.last5m || {}).circuit ? "t-warn" : "t-ok"}">${fmtN((ch.last5m || {}).circuit || 0)}</dd>
        </dl>
        ${ch.approx ? '<div class="t-mute" style="font-size:11px;margin-top:6px">≈ 表示仅统计主日志尾部 8MB 窗口，今日数为下界</div>' : ""}
        ${ex ? `<details style="margin-top:12px"><summary class="t-mute" style="cursor:pointer;font-size:12px">历史体检日志（已停用，仅供参考）</summary><dl class="kv" style="margin-top:8px"><dt>日志</dt><dd class="mono">${esc(ex.file)}</dd><dt>最后一轮</dt><dd>${esc(ex.round || "—")}</dd><dt>汇总</dt><dd class="mono">${esc(ex.summary || "—")}</dd><dt>更新</dt><dd class="t-warn">${ago(ex.mtime)}（体检循环已停，数据过期）</dd></dl></details>` : ""}
      </div>
    </div>
    <div class="grid g11" style="margin-top:16px">
      <div class="card"><h3>出错最多的房间<span class="r">近 24 小时</span></h3>${tops.length ? tops.map(r => `<div class="list-row"><div class="grow mono">${esc(r.room)}</div>${["room_fast", "room_deadline", "stream_fail"].map(k => r[k] ? `<span class="${CAT_L[k][1]}" style="font-size:12px">${CAT_L[k][0]} ${r[k]}</span>` : "").join("")}</div>`).join("") : '<div class="empty">没有</div>'}</div>
      <div class="card"><h3>进程</h3>${procList(d.procs)}</div>
    </div>
    <div class="card" style="margin-top:16px"><h3>最近错误日志<span class="r">${(ls.recent || []).length} 条</span></h3>
      ${(ls.recent || []).map(l => `<div class="logline"><span class="t-mute">${esc(l.ts.slice(5))}</span><span class="${l.level === "error" ? "t-bad" : "t-warn"}">${esc(l.level)}</span><span class="m">${esc(l.msg)} <span class="t-mute mono">${esc(l.room)}</span></span>${l.error ? `<span class="e">${esc(l.error)}</span>` : ""}</div>`).join("") || '<div class="empty">没有</div>'}</div>`;
}

// ---------------- 存储
async function loadStorage() {
  const d = await api("/api/storage");
  if (!d.disk) { $("#page").innerHTML = '<div class="ptitle"><h1>存储</h1></div><div class="card"><div class="empty">统计中，约 1 分钟后刷新</div></div>'; return; }
  const pct = d.disk.used / d.disk.total * 100, top = d.streamers.slice(0, 20), maxS = Math.max(1, ...top.map(s => s.size));
  const q = d.queue || {};
  $("#page").innerHTML = `<div class="ptitle"><h1>存储</h1><div class="sub"><span class="t-mute">更新于 ${ago(d.updated)}</span></div></div>
    <div class="grid g4">
      <div class="card"><div class="kpi-label">磁盘可用</div><div class="kpi">${fmtBytes(d.disk.free)}</div><div class="bar"><i style="width:${pct.toFixed(1)}%;background:${pct > 85 ? "var(--danger)" : pct > 70 ? "var(--warn)" : "var(--accent)"}"></i></div><div class="kpi-meta" style="margin-top:8px"><span>总 <b>${fmtBytes(d.disk.total)}</b></span><span>已用 <b>${pct.toFixed(0)}%</b></span></div></div>
      <div class="card"><div class="kpi-label">本地录像</div><div class="kpi">${fmtBytes(d.video_total)}</div><div class="kpi-meta"><span>主播目录 <b>${d.streamers.length}</b></span></div></div>
      <div class="card"><div class="kpi-label">待搬运</div><div class="kpi ${q.pending ? "t-warn" : ""}">${q.pending ?? "—"}</div><div class="kpi-meta"><span>跳过 <b>${q.skipped ?? "—"}</b></span></div></div>
      <div class="card"><div class="kpi-label">转码失败</div><div class="kpi ${q.failures ? "t-bad" : ""}">${q.failures ?? "—"}</div><div class="kpi-meta"><span>scripts/.flv-to-mp4-failures</span></div></div>
    </div>
    <div class="grid g11" style="margin-top:16px">
      <div class="card"><h3>各主播占用<span class="r">前 ${top.length}</span></h3>${top.filter(s => s.size).map(s => `<div class="list-row"><div class="grow"><div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)}</span><span class="t-2">${fmtBytes(s.size)}</span></div><div class="bar"><i style="width:${(s.size / maxS * 100).toFixed(1)}%"></i></div></div></div>`).join("") || '<div class="empty">本地没有录像（都已搬走）</div>'}</div>
      <div class="card"><h3>最近文件</h3>${d.recent_files.map(f => `<div class="list-row"><div class="grow who"><span class="n" style="max-width:none">${esc(f.file)}</span><span class="s">${esc(f.streamer)} · ${ago(f.mtime)}</span></div><span class="t-2" style="font-size:12px;white-space:nowrap">${fmtBytes(f.size)}</span></div>`).join("") || '<div class="empty">没有</div>'}</div>
    </div>`;
}

// ---------------- 操作日志
async function loadOplog() {
  const rows = await api("/api/oplog");
  $("#page").innerHTML = `<div class="ptitle"><h1>操作日志</h1><div class="sub"><span>最近 ${rows.length} 条</span></div></div>
    ${rows.length ? `<div class="frame"><div class="scroll"><table class="table resp"><thead><tr><th>时间</th><th>来源</th><th>操作</th><th>主播</th><th>详情</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td class="first t-2" style="white-space:nowrap">${fmtTs(r.ts)}</td><td data-l="来源"><span class="tag ${r.actor === "rule" ? "session" : "perm"}">${r.actor === "rule" ? "自动" : "手动"}</span></td>
      <td data-l="操作"><span class="st ${r.ok ? "" : "t-bad"}"><span class="pip ${r.ok ? "ok" : "bad"}"></span>${esc(r.action)}</span></td><td data-l="主播">${esc(r.host || "—")}</td><td data-l="详情" class="t-mute" style="font-size:12px;word-break:break-all">${esc(r.detail || "")}</td></tr>`).join("")}
    </tbody></table></div></div>` : '<div class="card"><div class="empty">还没有操作</div></div>'}`;
}

// ---------------- 设置
async function loadSettings() {
  $("#page").innerHTML = `<div class="ptitle"><h1>设置</h1></div>
    <div class="card" style="max-width:520px"><h3>修改登录密码</h3><form id="pwForm">
      <div class="field"><label>原密码</label><input class="input" type="password" id="pwOld" autocomplete="current-password" required></div>
      <div class="field"><label>新密码</label><input class="input" type="password" id="pwNew" autocomplete="new-password" minlength="6" required><div class="hint">至少 6 位。修改后其他设备上的登录会失效。</div></div>
      <div class="field"><label>确认新密码</label><input class="input" type="password" id="pwNew2" autocomplete="new-password" required></div>
      <button class="btn primary">保存</button></form></div>
    <div class="card" style="max-width:520px;margin-top:16px"><h3>API 密钥（iOS 快捷指令用）</h3>
      <div class="field"><label>请求头</label><input class="input mono" id="tokVal" readonly value="加载中…">
        <div class="hint">在快捷指令「获取 URL 内容」里加请求头 <span class="mono">Authorization</span>，值填上面整行（含 Bearer）。密钥等同于登录，不要外传。</div></div>
      <div style="display:flex;gap:8px"><button class="btn" id="tokCopy">复制</button><button class="btn danger" id="tokRot">重新生成</button></div></div>`;
  api("/api/token").then(d => $("#tokVal").value = "Bearer " + d.token).catch(e => $("#tokVal").value = e.message);
  $("#tokCopy").onclick = async () => { try { await navigator.clipboard.writeText($("#tokVal").value); toast("已复制"); } catch { $("#tokVal").select(); toast("请长按手动复制", "warn"); } };
  $("#tokRot").onclick = async () => {
    if (!confirm("重新生成后，旧密钥立即失效，已有的快捷指令要换成新密钥。继续？")) return;
    try { const d = await api("/api/token/rotate", { method: "POST" }); $("#tokVal").value = "Bearer " + d.token; toast("已重新生成"); } catch (e) { toast(e.message, "bad"); }
  };
  $("#pwForm").onsubmit = async e => {
    e.preventDefault();
    if ($("#pwNew").value !== $("#pwNew2").value) return toast("两次输入的新密码不一致", "bad");
    try { await api("/api/password", { method: "POST", body: { old: $("#pwOld").value, new: $("#pwNew").value } }); toast("密码已修改"); e.target.reset(); }
    catch (err) { toast(err.message, "bad"); }
  };
}

// ---------------- 快速添加（给 iOS 快捷指令 / 主屏幕用）
// 打开 /#add?url=<链接或分享文案>&mode=temp&hours=24 会预填，仍需手动点「添加」（防止外部链接替你提交）。
function loadQuickAdd() {
  const p = hashParams();
  const preset = p.get("url") || "";
  const mode = ["permanent", "temp", "session"].includes(p.get("mode")) ? p.get("mode") : "temp";
  const hours = Number(p.get("hours")) || 24;
  $("#page").innerHTML = `<div class="ptitle"><h1>快速添加</h1><div class="sub"><span class="t-mute">粘贴直播间链接或抖音分享文案</span></div></div>
    <div class="card" style="max-width:560px"><form id="qaForm">
      <div class="field"><label>链接 / 分享文案</label>
        <textarea class="input" id="qaUrl" rows="3" style="height:auto;resize:vertical;padding:8px 11px" placeholder="https://live.douyin.com/123456 或 抖音 App 里「分享 → 复制链接」的整段文字">${esc(preset)}</textarea>
        <div class="hint">短链接 v.douyin.com 会自动解析成直播间地址。</div></div>
      <button type="button" class="btn" id="qaPaste" style="margin:-4px 0 14px">从剪贴板粘贴</button>
      ${hostField(p.get("host"))}${modeForm(mode, hours)}
      <button class="btn primary" id="qaBtn" style="width:100%;justify-content:center;height:40px">添加</button>
      <div id="qaResult" style="margin-top:14px"></div></form></div>`;
  bindModeForm();
  $("#qaPaste").onclick = async () => {
    try { $("#qaUrl").value = await navigator.clipboard.readText(); } catch { toast("浏览器不允许读剪贴板，请长按输入框手动粘贴", "warn"); }
  };
  const submit = async () => {
    const b = $("#qaBtn"); b.disabled = true; b.textContent = "添加中…"; $("#qaResult").innerHTML = "";
    try {
      const r = await api("/api/rooms", { method: "POST", host: formHost(), body: { url: $("#qaUrl").value, ...formMode() } });
      const m = formMode();
      const desc = m.mode === "temp" ? `临时 ${m.hours} 小时` : m.mode === "session" ? (m.sessions > 1 ? `录 ${m.sessions} 场` : "只录本场") : "永久";
      $("#qaResult").innerHTML = `<div class="banner" style="color:var(--success);border-color:color-mix(in srgb,var(--success) 45%,transparent);background:color-mix(in srgb,var(--success) 8%,transparent)"><span class="pip ok"></span>${r.existed ? "房间已存在，已开启监听并设为" : "已添加，模式："}${desc}<a class="btn sm" href="#managed">查看</a></div>`;
      $("#qaUrl").value = ""; history.replaceState(null, "", "#add");
    } catch (e) { $("#qaResult").innerHTML = `<div class="banner" style="color:var(--danger);border-color:var(--danger);background:none"><span class="pip bad"></span>${esc(e.message)}</div>`; }
    b.disabled = false; b.textContent = "添加";
  };
  $("#qaForm").onsubmit = e => { e.preventDefault(); submit(); };
  if (preset) $("#qaBtn").focus();
}

// ---------------- 启动
applyTheme();
api("/api/me").then(d => d.authed ? boot() : showLogin()).catch(showLogin);
</script>
</body>
</html>
