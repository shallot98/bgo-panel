name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 构建（不签名）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project BgoPanel.xcodeproj -scheme BgoPanel -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -30

      - name: 临时签名并打包 IPA
        run: |
          set -euo pipefail
          APP="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name 'BgoPanel.app' -print -quit)"
          test -n "$APP"
          codesign --force --deep --sign - "$APP"
          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R "$APP" Payload/
          zip -qry dist/BgoPanel-unsigned.ipa Payload
          ls -lh dist/BgoPanel-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BgoPanel-ipa
          path: dist/BgoPanel-unsigned.ipa
          if-no-files-found: error

  publish:
    needs: build-ipa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: BgoPanel-ipa
          path: dist

      - name: 打 RootHide / rootless deb
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 'MARKETING_VERSION' ios/project.yml | sed -e 's/.*"\(.*\)".*/\1/')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          rm -rf debroot tmp
          mkdir -p debroot/var/jb/Applications debroot/DEBIAN tmp
          unzip -q dist/BgoPanel-unsigned.ipa -d tmp
          cp -R tmp/Payload/BgoPanel.app debroot/var/jb/Applications/
          {
            echo "Package: de.cenai.bgopanel"
            echo "Name: bgo面板"
            echo "Version: $VERSION"
            echo "Architecture: iphoneos-arm64"
            echo "Description: bililive-go 独立监控面板原生 iOS 客户端。"
            echo "Maintainer: shallot98"
            echo "Section: Applications"
            echo "Priority: optional"
          } > debroot/DEBIAN/control
          {
            echo "#!/bin/bash"
            echo 'for u in /var/jb/usr/bin/uicache /usr/bin/uicache; do'
            echo '  if [ -x "$u" ]; then "$u" -a && break; fi'
            echo "done"
            echo "exit 0"
          } > debroot/DEBIAN/postinst
          chmod 755 debroot/DEBIAN/postinst
          dpkg-deb -b --root-owner-group debroot dist/BgoPanel_iphoneos-arm64.deb
          dpkg-deb -I dist/BgoPanel_iphoneos-arm64.deb | head -12
          ls -lh dist

      - name: 更新发行版（固定 tag ios-latest）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="bgo面板 iOS App 最新构建（纯 Swift 原生客户端）。

          安装方式：

          - TrollStore（巨魔）：手机打开 BgoPanel-unsigned.ipa 直接安装
          - 越狱机：dpkg -i BgoPanel_iphoneos-arm64.deb（安装到 /var/jb/Applications，自动 uicache）
          - 自签侧载：AltStore / Sideloadly 导入 IPA 用 Apple ID 重签

          首次打开在登录页填入服务器地址（默认 https://bgp.cenai.de）与 Web 设置页生成的 API Token 即可免密连接。

          版本 $VERSION · 构建 ${GITHUB_SHA::7} · 每次 push 到 main 会自动更新这里的 IPA 与 deb。"
          if gh release view ios-latest >/dev/null 2>&1; then
            gh release edit ios-latest --title "bgo面板 iOS App（最新构建）" --notes "$NOTES" --latest
          else
            gh release create ios-latest --title "bgo面板 iOS App（最新构建）" --notes "$NOTES" --latest
          fi
          gh release upload ios-latest dist/BgoPanel-unsigned.ipa dist/BgoPanel_iphoneos-arm64.deb --clobber
